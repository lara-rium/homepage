<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>lara's portfolio</title>
    <link rel="canonical" href="https://lara.lv/" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="icon" href="assets/favicon.png" sizes="32x32" />
    <!-- html-validate-disable-next nice-checkers/latest-packages, require-sri -->
    <link rel="stylesheet" href="https://use.typekit.net/jyg5egw.css" />
    <script src="js/lottie.js"></script>
    <script type="module" src="js/index.js"></script>
  </head>
  <body>
    <img
      src="assets/arrow.svg"
      class="arrow arrow-landscape arrow-left arrow-left-hidden"
      id="arrow-left-landscape"
      alt="arrow left"
    />
    <div class="middle">
      <div
        id="section-text"
        class="text section-text section-text-hidden top-bottom"
      >
        a
      </div>
      <div class="middle-center">
        <!-- html-validate-disable-next element-required-attributes -->
        <img
          alt=""
          id="portfolio"
          class="portfolio portfolio-hidden hidden middle-center-elem"
        />
        <div id="circle" class="circle middle-center-elem">
          <div id="circle-text" class="circle-text"></div>
        </div>
      </div>
      <div class="bottom-container top-bottom">
        <img
          src="assets/arrow.svg"
          class="arrow arrow-portrait arrow-left arrow-left-hidden"
          id="arrow-left-portrait"
          alt="arrow left"
        />
        <div id="bottom" class="bottom bottom-hidden top-bottom">
          <div id="description-text" class="text description-text"></div>
          <div id="made-with" class="text made-with-text">
            made with
            <!-- html-validate-disable-next element-required-attributes -->
            <img id="made-with-icon" alt="" class="made-with-icon" />
            <!-- html-validate-disable-next element-required-attributes -->
            <img
              id="made-with-icon-secondary"
              alt=""
              class="made-with-icon hidden"
            />
          </div>
        </div>
        <img
          src="assets/arrow.svg"
          class="arrow arrow-portrait arrow-right arrow-right-hidden"
          id="arrow-right-portrait"
          alt="arrow right"
        />
      </div>
    </div>
    <img
      src="assets/arrow.svg"
      class="arrow arrow-landscape arrow-right arrow-right-hidden"
      id="arrow-right-landscape"
      alt="arrow right"
    />
  </body>
</html>
